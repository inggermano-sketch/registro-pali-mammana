<style>
:root{
  --bg:#eef1f5;
  --surface:#ffffff;
  --surface-2:#e8ecf2;
  --fg:#15202b;
  --muted:#5c6773;
  --border:#d3d9e2;
  --accent:#0f2d5c;
  --accent-fg:#f3f6fb;
  --good:#2f6b3f;
  --danger:#a83232;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#12151a;
    --surface:#1b1f26;
    --surface-2:#222731;
    --fg:#e9edf3;
    --muted:#9aa4b2;
    --border:#333b47;
    --accent:#4d7fd6;
    --accent-fg:#0b1220;
    --good:#6fbf7f;
    --danger:#e08080;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#12151a; --surface:#1b1f26; --surface-2:#222731; --fg:#e9edf3; --muted:#9aa4b2;
  --border:#333b47; --accent:#4d7fd6; --accent-fg:#0b1220; --good:#6fbf7f; --danger:#e08080;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:'Archivo',system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-text-size-adjust:100%;}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:20;background:var(--surface-2);}
.gutter{padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px));}
h1,h2,h3{font-family:'Archivo',system-ui,sans-serif;margin:0;text-wrap:balance}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
button,select{font-family:inherit}
header.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;background:var(--surface-2);border-bottom:1px solid var(--border);}
header.topbar .inner{padding-block:14px;display:flex;align-items:center;justify-content:space-between;gap:10px;}
header.topbar h1{font-size:17px;font-weight:800;letter-spacing:-0.01em}
header.topbar .count{font-size:12px;color:var(--muted)}
.icon-btn{border:1px solid var(--border);background:var(--surface);color:var(--fg);border-radius:9px;width:34px;height:34px;display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer;flex:none;}
main{padding-block:16px 100px;min-height:100%}
.empty{margin-top:14vh;text-align:center;color:var(--muted)}
.empty .mark{width:52px;height:52px;margin:0 auto 14px;border:2px solid var(--border);border-radius:12px;display:flex;align-items:center;justify-content:center;}
.empty h2{font-size:16px;color:var(--fg);margin-bottom:6px}
.empty p{font-size:13.5px;max-width:260px;margin:0 auto;line-height:1.5}
.card-list{display:flex;flex-direction:column;gap:10px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;}
.card .row1{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.card .palo-name{font-size:16px;font-weight:800}
.card .wbs-name{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.card .date{font-size:12px;color:var(--muted)}
.badge{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:3px 10px;font-size:11px;font-weight:700;letter-spacing:.02em;}
.badge.ok{background:rgba(47,107,63,.14);color:var(--good)}
.card .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding-top:8px;border-top:1px dashed var(--border);}
.stat{min-width:0}
.stat .k{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.stat .v{font-size:14px;font-weight:600}
.card .actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--border);background:var(--surface-2);color:var(--fg);border-radius:9px;padding:9px 13px;font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;min-width:0;}
.btn:active{opacity:.75}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn.sm{padding:7px 10px;font-size:12px}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.fab{position:fixed;right:max(18px, calc(env(safe-area-inset-right,0px) + 14px));bottom:max(18px, calc(env(safe-area-inset-bottom,0px) + 14px));z-index:18;background:var(--accent);color:var(--accent-fg);border:none;border-radius:999px;width:58px;height:58px;font-size:28px;font-weight:600;box-shadow:0 6px 16px -4px rgba(0,0,0,.35);cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1;}
.fab:active{transform:scale(.95)}
.overlay{position:fixed;inset:0;background:var(--bg);z-index:30;display:flex;flex-direction:column;overflow:hidden}
.overlay .formhead{position:sticky;top:env(safe-area-inset-top,0px);background:var(--surface-2);border-bottom:1px solid var(--border);padding-block:14px;display:flex;align-items:center;justify-content:space-between;gap:10px;z-index:2;}
.overlay .formhead h2{font-size:16px}
.overlay .formbody{overflow-y:auto;padding-block:16px 120px;flex:1}
.section{margin-bottom:22px}
.section-title{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:10px;display:flex;align-items:center;gap:8px;}
.section-title .line{flex:1;height:1px;background:var(--border)}
.section-note{font-size:12px;color:var(--muted);background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:10px;line-height:1.5;}
.field-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field.full{grid-column:1 / -1}
.field label{font-size:11.5px;color:var(--muted);font-weight:600}
.field input, .field select{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:15px;padding:10px 11px;border-radius:9px;border:1px solid var(--border);background:var(--surface);color:var(--fg);width:100%;min-width:0;}
.field input:focus, .field select:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
.field .unit{font-size:11px;color:var(--muted);margin-top:1px}
.strato-row,.delivery-row{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:10px;position:relative;}
.strato-row .dhead,.delivery-row .dhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.strato-row .tag,.delivery-row .tag{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.strato-row .remove,.delivery-row .remove{border:none;background:transparent;color:var(--danger);font-size:13px;font-weight:600;cursor:pointer;padding:4px 6px}
.add-row{width:100%;border:1.5px dashed var(--border);background:transparent;color:var(--accent);border-radius:12px;padding:12px;font-weight:700;font-size:13.5px;cursor:pointer;}
.summary-bar{display:flex;justify-content:space-between;align-items:center;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-top:4px;font-size:12.5px;color:var(--muted);}
.summary-bar b{color:var(--fg)}
.diff-warn{color:var(--danger)}
.diff-ok{color:var(--good)}
.overlay .formfoot{position:fixed;left:0;right:0;bottom:0;padding-bottom:max(14px, env(safe-area-inset-bottom,0px));padding-top:12px;background:var(--surface-2);border-top:1px solid var(--border);display:flex;gap:10px;z-index:3;}
.overlay .formfoot .btn{flex:1;justify-content:center;padding-block:12px;font-size:14px}
.toast{position:fixed;left:50%;bottom:max(90px, calc(env(safe-area-inset-bottom,0px) + 80px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:13px;font-weight:600;z-index:50;opacity:0;pointer-events:none;transition:opacity .2s ease;}
.toast.show{opacity:1}
@media (min-width:640px){
  .gutter{max-width:640px;margin-inline:auto;padding-left:16px;padding-right:16px}
  header.topbar .inner, .overlay .formhead, .overlay .formbody, .overlay .formfoot{max-width:640px;margin-inline:auto}
}
</style>
</head>

<script>
(function(){
  "use strict";
  var STORAGE_KEY = "regpali_mammana_v1";
  var DEFAULTS_KEY = "regpali_mammana_defaults_v1";
  var GIORN_COUNTER_KEY = "regpali_mammana_giorn_counter_v1";

  function peekNextSchedaN(){
    var c = parseInt(loadStr(GIORN_COUNTER_KEY)||"0", 10);
    if(isNaN(c)) c = 0;
    return c+1;
  }
  function bumpGiornCounter(usedValue){
    var used = parseInt(usedValue, 10);
    saveStr(GIORN_COUNTER_KEY, String(isNaN(used) ? peekNextSchedaN() : used));
  }

  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }

  function loadJSON(key, fallback){
    try{ var raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : fallback; }
    catch(e){ return fallback; }
  }
  function saveJSON(key, val){ try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){} }
  function loadStr(key){ try{ return localStorage.getItem(key) || ""; }catch(e){ return ""; } }
  function saveStr(key, val){ try{ localStorage.setItem(key, val); }catch(e){} }

  var DEFAULT_SETTINGS = {
    attrezzaturaPerforazione: ""
  };

  var records = loadJSON(STORAGE_KEY, []);
  var settings = Object.assign({}, DEFAULT_SETTINGS, loadJSON(DEFAULTS_KEY, {}));

  function todayISO(){
    var d = new Date();
    return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  }
  function fmtDateIt(iso){
    if(!iso) return "—";
    var p = iso.split("-");
    return p.length===3 ? (p[2]+"/"+p[1]+"/"+p[0]) : iso;
  }
  function n(v, dec){
    if(v===""||v===null||v===undefined||isNaN(v)) return "—";
    return Number(v).toFixed(dec===undefined?1:dec).replace(/\.0+$/,"").replace(/(\.\d*[1-9])0+$/,"$1");
  }
  function esc(s){
    return String(s===undefined||s===null?"":s).replace(/[&<>"]/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];
    });
  }
  function opts(list, val){
    return list.map(function(o){
      return '<option value="'+o.v+'" '+(val===o.v?"selected":"")+'>'+o.l+'</option>';
    }).join("");
  }
  function wbsOpts(val){ return opts([{v:"1",l:"Pali Trafo 1"},{v:"2",l:"Pali Trafo 2"},{v:"S",l:"Pali Trafo S"}], val); }
  function siNoOpts(val){ return opts([{v:"NO",l:"NO"},{v:"SI",l:"SI"}], val); }
  function tipoGettoOpts(val){
    return opts([
      {v:"A", l:"A - TUBO GETTO"},
      {v:"B", l:"B - BETONPOMPA CON AUSILIO DI SPILLO"}
    ], val);
  }
  function wbsFull(rec){ return "Pali Trafo " + (rec.wbsSuffix||"1"); }
  function tipoGettoLabel(v){
    return v==="B" ? "B - BETONPOMPA CON AUSILIO DI SPILLO" : "A - TUBO GETTO";
  }

  function newStrato(){ return { key: uid(), daA:"", descrizione:"" }; }
  function newDelivery(){ return { key: uid(), ddt:"", volume:"", oraInizio:"", oraFine:"", slump:"", temperatura:"" }; }

  function newRecord(){
    return {
      id: uid(),
      createdAt: Date.now(),
      wbsSuffix: "1",
      numeroPalo: "",
      attrezzaturaPerforazione: settings.attrezzaturaPerforazione,
      dataPerforazione: "", dataGetto: todayISO(),
      lunghezzaPerforazione: "", calcestruzzoTeorico: "",
      rivestimento: "NO",
      presenzaAcqua: "NO", acquaDaM:"", acquaAM:"",
      idPrelievo: "",
      tipologiaGetto: "A",
      stratigrafia: [ newStrato() ],
      getti: [ newDelivery() ],
      slumpGiornaliera: "",
      noteAggiuntive: "",
      exportatoPdf: false
    };
  }

  var MAX_PALI_ATTIVI = 30;

  function pruneOldExportedIfOverLimit(justSavedId){
    if(records.length <= MAX_PALI_ATTIVI) return null;
    var candidates = records
      .filter(function(r){ return r.id !== justSavedId && r.exportatoPdf; })
      .sort(function(a,b){ return a.createdAt - b.createdAt; });
    if(candidates.length === 0) return null;
    var toRemove = candidates[0];
    records = records.filter(function(r){ return r.id !== toRemove.id; });
    saveJSON(STORAGE_KEY, records);
    return toRemove;
  }

  var appEl = document.getElementById("app");
  var overlayRoot = document.getElementById("overlayRoot");
  var countLabel = document.getElementById("countLabel");
  var toastEl = document.getElementById("toast");
  var toastTimer = null;

  function showToast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toastEl.classList.remove("show"); }, 2400);
  }

  // ---------------- LIST ----------------
  function renderList(){
    countLabel.textContent = records.length + (records.length===1 ? " palo" : " pali");

    if(records.length===0){
      appEl.innerHTML =
        '<div class="empty">'+
          '<div class="mark">📋</div>'+
          '<h2>Nessun palo registrato</h2>'+
          '<p>Tocca + per compilare la scheda del primo palo: dati di perforazione, stratigrafia, acciai e getto.</p>'+
        '</div>';
      return;
    }

    var sorted = records.slice().sort(function(a,b){ return b.createdAt - a.createdAt; });
    var html = '<div class="card-list">';
    sorted.forEach(function(r){
      var totVersato = r.getti.reduce(function(s,g){ return s + (parseFloat(g.volume)||0); }, 0);
      var teorico = parseFloat(r.calcestruzzoTeorico)||0;
      html +=
        '<div class="card">'+
          '<div class="row1">'+
            '<div>'+
              '<div class="palo-name">Palo '+esc(r.numeroPalo||"—")+'</div>'+
              '<div class="wbs-name">'+esc(wbsFull(r))+'</div>'+
              '<div class="date mono">'+fmtDateIt(r.dataGetto)+'</div>'+
            '</div>'+
            (r.exportatoPdf ? '<span class="badge ok">✓ Esportato</span>' : '')+
          '</div>'+
          '<div class="stats">'+
            '<div class="stat"><div class="k">Teorico / versato</div><div class="v mono">'+n(teorico,2)+' / '+n(totVersato,2)+' m³</div></div>'+
            '<div class="stat"><div class="k">Consegne</div><div class="v mono">'+r.getti.length+'</div></div>'+
            '<div class="stat"><div class="k">Tipologia</div><div class="v mono">'+esc(r.tipologiaGetto||"A")+'</div></div>'+
          '</div>'+
          '<div class="actions">'+
            '<button class="btn sm" data-act="edit" data-id="'+r.id+'">Apri / Modifica</button>'+
            '<button class="btn sm ghost" data-act="pdf" data-id="'+r.id+'">Esporta PDF</button>'+
          '</div>'+
        '</div>';
    });
    html += '</div>';
    appEl.innerHTML = html;
  }

  function closeOverlay(){ overlayRoot.innerHTML = ""; }

  // ---------------- SETTINGS OVERLAY ----------------
  function renderSettings(){
    function html(){
      return (
        '<div class="overlay">'+
          '<div class="formhead gutter">'+
            '<button class="btn ghost sm" id="stCancel">Chiudi</button>'+
            '<h2>Dati fissi cantiere</h2>'+
            '<span style="width:50px"></span>'+
          '</div>'+
          '<div class="formbody gutter">'+
            '<div class="section-note">Questo valore viene precompilato in ogni nuova scheda palo (resta comunque modificabile scheda per scheda).</div>'+
            '<div class="section">'+
              '<div class="field-grid">'+
                '<div class="field full"><label for="st-att">Attrezzatura perforazione</label><input id="st-att" type="text" value="'+esc(settings.attrezzaturaPerforazione)+'"></div>'+
              '</div>'+
            '</div>'+
          '</div>'+
          '<div class="formfoot gutter">'+
            '<button class="btn primary" id="stSave">Salva valore di default</button>'+
          '</div>'+
        '</div>'
      );
    }
    overlayRoot.innerHTML = html();
    document.getElementById("stCancel").onclick = closeOverlay;
    document.getElementById("stSave").onclick = function(){
      settings = { attrezzaturaPerforazione: document.getElementById("st-att").value };
      saveJSON(DEFAULTS_KEY, settings);
      closeOverlay();
      showToast("Valore di default salvato");
    };
  }

  // ---------------- FORM OVERLAY: SCHEDA SINGOLO PALO ----------------
  function renderForm(recordId){
    var isNew = !recordId;
    var rec = isNew ? newRecord() : JSON.parse(JSON.stringify(records.find(function(r){ return r.id===recordId; })));
    if(!rec){ closeOverlay(); renderList(); return; }
    if(!rec.getti || rec.getti.length===0) rec.getti = [newDelivery()];
    if(!rec.stratigrafia || rec.stratigrafia.length===0) rec.stratigrafia = [newStrato()];

    function stratoRowHtml(s, idx){
      return (
        '<div class="strato-row" data-strato-key="'+s.key+'">'+
          '<div class="dhead">'+
            '<span class="tag">Strato '+(idx+1)+'</span>'+
            (rec.stratigrafia.length>1 ? '<button type="button" class="remove" data-removestrato="'+s.key+'">Rimuovi</button>' : '')+
          '</div>'+
          '<div class="field-grid">'+
            '<div class="field"><label>Da - A (m)</label><input data-sfield="daA" data-skey="'+s.key+'" type="text" placeholder="es. 0,00 - 2,50" value="'+esc(s.daA)+'"></div>'+
            '<div class="field"><label>Descrizione litologica</label><input data-sfield="descrizione" data-skey="'+s.key+'" type="text" value="'+esc(s.descrizione)+'"></div>'+
          '</div>'+
        '</div>'
      );
    }

    function deliveryRowHtml(g, idx){
      return (
        '<div class="delivery-row" data-key="'+g.key+'">'+
          '<div class="dhead">'+

  // ---------------- PDF EXPORT: SCQ_PALO_2 Trafo (singolo palo) ----------------
  var PAGE_H = 841.68;
  function topY(page, topdownY){ return PAGE_H - topdownY; }

  function b64ToBytes(b64){
    var bin = atob(b64);
    var bytes = new Uint8Array(bin.length);
    for(var i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
    return bytes;
  }
  function itNum(v){
    if(v===""||v===null||v===undefined||isNaN(v)) return "";
    return String(v).replace(".", ",");
  }
  function wrapText(str, maxCharsPerLine){
    var words = String(str).split(/\s+/);
    var lines = []; var cur = "";
    words.forEach(function(w){
      if((cur+" "+w).trim().length > maxCharsPerLine){
        if(cur) lines.push(cur.trim());
        cur = w;
      } else {
        cur = (cur+" "+w).trim();
      }
    });
    if(cur) lines.push(cur.trim());
    return lines;
  }

  async function exportPdf(recordId){
    var rec = records.find(function(r){ return r.id===recordId; });
    if(!rec){ return; }
    if(!window.PDFLib){ showToast("Libreria PDF non disponibile"); return; }
    try{
      var PDFDocument = window.PDFLib.PDFDocument;
      var StandardFonts = window.PDFLib.StandardFonts;
      var rgb = window.PDFLib.rgb;
      var RED = rgb(0.75,0.1,0.1);
      var GREEN = rgb(0,0.45,0.1);

      var pdfDoc = await PDFDocument.load(b64ToBytes(TEMPLATE_PDF_B64));
      var page = pdfDoc.getPages()[0];
      var font = await pdfDoc.embedFont(StandardFonts.Helvetica);
      var fontBold = await pdfDoc.embedFont(StandardFonts.HelveticaBold);

      function text(str, x, top, opts){
        opts = opts || {};
        if(str===undefined||str===null||str==="") return;
        var size = opts.size || 9;
        var useFont = opts.bold ? fontBold : font;
        var yOff = (opts.yOffset===undefined ? 2.4 : opts.yOffset);
        page.drawText(String(str), { x: x, y: topY(page, top)+yOff, size: size, font: useFont, color: opts.color || rgb(0,0,0) });
      }
      function check(xCenter, bottomTopDown, scale){
        scale = scale || 1;
        var yBase = topY(page, bottomTopDown) - 1;
        page.drawLine({ start:{x:xCenter-4*scale,y:yBase+2*scale}, end:{x:xCenter-1*scale,y:yBase-1*scale}, thickness:1.3*scale, color:GREEN });
        page.drawLine({ start:{x:xCenter-1*scale,y:yBase-1*scale}, end:{x:xCenter+5*scale,y:yBase+5*scale}, thickness:1.3*scale, color:GREEN });
      }

      // Identificazione
      text(wbsFull(rec), 65, 203.6, {size:10});
      text(rec.numeroPalo, 312, 203.6, {size:10});
      text(rec.attrezzaturaPerforazione, 205, 240.2, {size:9});

      // Box sinistro
      if(rec.dataPerforazione) text(fmtDateIt(rec.dataPerforazione), 190, 267.4, {size:9.5});
      if(rec.lunghezzaPerforazione) text(itNum(n(rec.lunghezzaPerforazione,2))+"m", 190, 309.3, {size:9.5});
      if(rec.dataGetto) text(fmtDateIt(rec.dataGetto), 190, 330.2, {size:9.5});
      if(rec.calcestruzzoTeorico) text(itNum(n(rec.calcestruzzoTeorico,2)), 190, 351.2, {size:9.5});

      // Box destro: Rivestimento / Palo strumentato (sempre NO) / Presenza acqua
      // Spunta verde centrata esattamente sul testo SI/NO corrispondente (coordinate estratte dal PDF).
      check(rec.rivestimento==="SI"?482:528, 253.3);
      check(528, 274.3); // Palo strumentato: sempre NO
      check(rec.presenzaAcqua==="SI"?411:444, 297.0);
      if(rec.presenzaAcqua==="SI"){
        if(rec.acquaDaM) text(itNum(rec.acquaDaM), 467, 318, {size:9});
        if(rec.acquaAM) text(itNum(rec.acquaAM), 512, 318, {size:9});
      }
      text(rec.idPrelievo, 465, 345.2, {size:9});
      if(rec.tipologiaGetto==="B"){
        text("B - BETONPOMPA CON", 424, 357.4, {size:7.5});
        text("AUSILIO DI SPILLO", 424, 366.0, {size:7.5});
      } else {
        text("A - TUBO GETTO", 465, 362.5, {size:8.5});
      }

      // Descrizione stratigrafica (5 righe disponibili sul modulo)
      var stratoRows = [414.0, 438.3, 461.9, 486.2, 510.4];
      rec.stratigrafia.slice(0,5).forEach(function(s, i){
        if(s.daA) text(s.daA, 48, stratoRows[i], {size:8});
        if(s.descrizione) text(s.descrizione, 153, stratoRows[i], {size:8});
      });
      if(rec.stratigrafia.length > 5){
        text("+"+(rec.stratigrafia.length-5)+" strati ulteriori non riportati (vedi app)", 48, 524, {size:6.5, color: RED});
      }

      // Verifica dimensione acciai: sempre CONFORME (spunta verde)
      check(198, 603.4);
      check(198, 636.7);
      check(198, 670.1);
      check(198, 703.4);

      // Riepilogo dati getto (6 righe)
      var rowsGetto = [607.9, 625.5, 641.7, 658.9, 674.7, 692.3];
      var colX = { ddt:245, m3:308, oi:345, of:382, slump:420, temp:490 };
      rec.getti.slice(0,6).forEach(function(g, i){
        var y = rowsGetto[i];
        if(g.ddt) text(g.ddt, colX.ddt, y, {size:8, yOffset:0});
        if(g.volume) text(n(g.volume,2), colX.m3, y, {size:8, yOffset:0});
        if(g.oraInizio) text(g.oraInizio, colX.oi, y, {size:8, yOffset:0});
        if(g.oraFine) text(g.oraFine, colX.of, y, {size:8, yOffset:0});
        if(g.slump) text(n(g.slump,1), colX.slump, y, {size:8, yOffset:0});
        if(g.temperatura) text(n(g.temperatura,1), colX.temp, y, {size:8, yOffset:0});
      });
      if(rec.getti.length > 6){
        text("+"+(rec.getti.length-6)+" ulteriori consegne non riportate (vedi app)", 122, 720, {size:7, color: RED});
      }

      text(rec.noteAggiuntive, 122, 738.0, {size:8, maxWidth:400});

      var pdfBytes = await pdfDoc.save();
      downloadBlob(pdfBytes, "palo_"+(rec.numeroPalo||rec.id).replace(/[^a-z0-9.\-]+/gi,"_")+"_"+rec.dataGetto+".pdf");

      rec.exportatoPdf = true;
      saveJSON(STORAGE_KEY, records);
      renderList();
    }catch(e){
      console.error(e);
      showToast("Esportazione non riuscita");
    }
  }

  function downloadBlob(bytes, filename){
    var blob = new Blob([bytes], { type: "application/pdf" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
  }

  // ---------------- PDF EXPORT: Scheda Pali Giornaliera (max 10 pali/pagina, max 15/giorno -> 2 pagine) ----------------
  var PAGE_H_G = 612.0;
  var COLS_G = [231.0, 285.8, 340.7, 394.2, 449.0, 503.0, 557.9, 612.7, 667.6, 721.1, 769.6]; // 10 colonne

  async function exportGiornaliera(dataGiorno, schedaN, piles){
    if(!window.PDFLib){ showToast("Libreria PDF non disponibile"); return false; }
    try{
      var PDFDocument = window.PDFLib.PDFDocument;
      var StandardFonts = window.PDFLib.StandardFonts;
      var rgb = window.PDFLib.rgb;
      var BLACK = rgb(0,0,0);
      var dataLabel = fmtDateIt(dataGiorno);

      var chunks = [];
      for(var i=0;i<piles.length;i+=10){ chunks.push(piles.slice(i, i+10)); }
      if(chunks.length===0) chunks.push([]);

      var finalDoc = await PDFDocument.create();

      for(var ci=0; ci<chunks.length; ci++){
        var srcDoc = await PDFDocument.load(b64ToBytes(TEMPLATE_GIORNALIERA_B64));
        var page = srcDoc.getPages()[0];
        var font = await srcDoc.embedFont(StandardFonts.Helvetica);
        var fontBold = await srcDoc.embedFont(StandardFonts.HelveticaBold);

        (function(page, font, fontBold, chunkPiles){
          function Yg(top){ return PAGE_H_G - top; }
          function txt(str, x, top, opts){
            opts = opts || {};
            if(str===undefined||str===null||str==="") return;
            var size = opts.size || 7.5;
            var useFont = opts.bold ? fontBold : font;
            // default: centra verticalmente il testo nella cella (celle alte ~19.9-20.3pt)
            page.drawText(String(str), { x:x, y:Yg(top)+(opts.yOffset===undefined?7.3:opts.yOffset), size:size, font:useFont, color: opts.color||BLACK });
          }

          txt(dataLabel, 107, 131.0, {size:9, bold:true});
          txt(schedaN, 735, 58.5, {size:9, bold:true});

          var ROW = {
            nome:155.0, prof:195.2, diam:215.2, verticalita:235.1,
            consPul:294.8, sovrapp:314.8, qgabbia:334.7,
            slump:394.4, ddt1:434.3, ddt2:454.2, vol:474.1, qgetto:494.0
          };

          chunkPiles.forEach(function(p, idx){
            var xc = COLS_G[idx] + 4;
            txt(p.numeroPalo, xc, ROW.nome, { bold:true, size:8 });
            if(p.lunghezzaPerforazione) txt(itNum(n(p.lunghezzaPerforazione,2)), xc, ROW.prof, {size:7.5});
            txt("800", xc, ROW.diam, {size:7.5});
            txt("OK", xc, ROW.verticalita, {size:7.5});
            txt("OK", xc, ROW.consPul, {size:7.5});
            txt("N.A.", xc, ROW.sovrapp, {size:7});
            txt("si veda report", xc, ROW.qgabbia, {size:5.3, yOffset:13.5});
            txt("topografico", xc, ROW.qgabbia, {size:5.3, yOffset:5.5});
            if(p.slumpGiornaliera) txt(n(p.slumpGiornaliera,1), xc, ROW.slump, {size:7.5});
            var g1 = p.getti && p.getti[0], g2 = p.getti && p.getti[1];
            if(g1 && g1.ddt) txt(g1.ddt, xc, ROW.ddt1, {size:7, maxWidth:48});
            if(g2 && g2.ddt) txt(g2.ddt, xc, ROW.ddt2, {size:7, maxWidth:48});
            var totVol = (p.getti||[]).reduce(function(s,gg){ return s+(parseFloat(gg.volume)||0); }, 0);
            if(totVol>0) txt(itNum(n(totVol,2)), xc, ROW.vol, {size:7.5});
            txt("si veda report", xc, ROW.qgetto, {size:5.3, yOffset:13.5});
            txt("topografico", xc, ROW.qgetto, {size:5.3, yOffset:5.5});
          });
        })(page, font, fontBold, chunks[ci]);

        var copied = await finalDoc.copyPages(srcDoc, [0]);
        finalDoc.addPage(copied[0]);
      }

      var pdfBytes = await finalDoc.save();
      downloadBlob(pdfBytes, "scheda_giornaliera_"+dataGiorno+"_n"+schedaN+".pdf");
      return true;
    }catch(e){
      console.error(e);
      showToast("Esportazione giornaliera non riuscita");
      return false;
    }
  }

  appEl.addEventListener("click", function(e){
    var btn = e.target.closest("[data-act]");
    if(!btn) return;
    var act = btn.getAttribute("data-act");
    var id = btn.getAttribute("data-id");
    if(act==="edit") renderForm(id);
    if(act==="pdf") exportPdf(id);
  });

  document.getElementById("fabNew").onclick = function(){ renderForm(null); };
  document.getElementById("btnSettings").onclick = renderSettings;
  document.getElementById("btnGiornaliera").onclick = renderGiornaliera;

  renderList();
})();
</script>
</body>
</html>
